<body style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
    <form>
    <h3>Kindly fill out this onboarding form</h3>
    
    <label for="name">Preferred Username:</label>
    <input type="text" id="name">
   
    <br><br>
    <label for="email">Email Address:</label>
    <input type="email" id="email" required placeholder="@gmail.com">
    
    <br><br>
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" value="1" min="1" max="5">

    <br><br>
    <label for="password">Preferred Password:</label>
    <input type="password" id="password" required placeholder="At least 8 characters" maxlength="8 characters">
    
    <br><br>
    <label for="date">Birth Date:</label>
    <input type="date" id="date">
    
    <br><br>
    <label for="name">Contact Number</label>
    <input type="tel" id="name" placeholder="0901-0000-000">

    <br><br>
    <label for="radio">Occupation:</label>

    <label for="Student">Student</label>
    <input type="radio" id="Student" name="Occupation">
    <label for="Civil Servant">Civil Servant</label>
    <input type="radio" id="Civil Servant" name="Occupation">
    <label for="Business Owner">Business Owner</label>
    <input type="radio" id="Business Owner" name="Occupation">
    
    <br><br>
    <label for="checkbox">Hobbies:</label>

    <label for="Travelling">Travelling</label>
    <input type="checkbox" id="Travelling">
    <label for="Sports">Sports</label>
    <input type="checkbox" id="Sports">
    <label for="Reading">Reading</label>
    <input type="checkbox" id="Reading">
    

    <br><br>
    <label for="file">Upload a photo:</label>
    <input type="file" id="file">

    <br><br>
    <label for="Payment">Payment Options:</label>

    <select name="Payment" id="Payment">
      <option value="Visa">Visa</option>
      <option value="Verve">Verve</option>
      <option value="Mastercard">Mastercard</option>
    </select>
 
    <br><br><br>
    <label for="comments">Leave a feedback below <br><br></label>
    <textarea name="comments" id="comments" cols="50" rows="10"></textarea>
    
    <br><br>  
    <input type="submit" style=
    "background-color: #6750A4;
    border: none;
    color: white; 
    border-radius: 15px; 
    padding: 10px 20px;">

    <input type="reset" style=
    "border: none;
    background-color:#E8DEF8;
    border-radius: 15px; 
    padding: 10px 20px">
    </form>

<footer style="background-color: #121212; text-align: center">
